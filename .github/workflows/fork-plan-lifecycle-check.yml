# Fork-only. Deterministically enforces the plan approval lifecycle documented
# in .github/fork-only/plans/README.md: an approved plan must carry
# machine-readable lifecycle evidence (requirements answered, review
# completed/waived, an owner-authored "Approve plan" comment on the PR),
# and "Fixes #N" may only be armed on an implementation, tooling, or maintenance PR once that evidence
# checks out and GitHub itself reports the closing reference. Never proposed
# upstream itself.
name: Fork Plan Lifecycle Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main]
    paths:
      - ".github/fork-only/plans/**"
      - ".github/fork-only/README.md"
      - ".github/agents/dev-orchestrator.agent.md"
      - ".github/agents/plan-reviewer.agent.md"
      - ".github/workflows/fork-issue-planner.md"
      - ".github/workflows/fork-issue-planner.lock.yml"
      - ".github/workflows/fork-*.md"
      - ".github/workflows/fork-*.lock.yml"
      - ".github/workflows/fork-*.yml"
      - "agents/oracle-to-postgres-migration-expert.agent.md"
      - "plugins/oracle-to-postgres-migration-expert/**"
      - "skills/*oracle-to-postgres*/**"
      - "eng/fork-*"
      - "eng/validate-fork-plan-lifecycle.mjs"
      - "eng/validate-fork-plan-lifecycle.test.mjs"
      - "package.json"
      - ".github/workflows/fork-plan-lifecycle-check.yml"
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number whose linked pull requests should be revalidated
        required: true
        type: number

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  lifecycle-check:
    name: Plan approval lifecycle validation
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'fork-sync') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lifecycle validator tests
        id: tests
        continue-on-error: true
        run: npm run fork:lifecycle:test

      - name: Validate plan approval lifecycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORK_LIFECYCLE_TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: npm run fork:lifecycle
